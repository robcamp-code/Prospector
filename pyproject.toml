    "python-dotenv>=1.2.0",
    "langchain-core>=1.3.3",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.51",
    "psycopg2-binary>=2.9.12",
    "pandas>=3.0.3",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "alembic>=1.14.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "sqlmodel>=0.0.39",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.14.2",
    "greenlet>=3.5.3",
    "langgraph-cli[inmem]>=0.4.31",
    "langsmith[claude-agent-sdk]>=0.9.7",
    "langchain-google-genai>=4.2.7",
    "langchain-anthropic>=1.5.2",
