<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Location Intelligence Report{% endblock %} | Prospector</title>
    <style>
        {% include 'styles.css' %}
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}

        <footer class="report-footer">
            <p>Generated by Prospector | {{ generated_at.strftime('%B %d, %Y at %I:%M %p') }}</p>
            <p>Data sources: US Census Bureau, Google Places API</p>
        </footer>
    </div>
</body>
</html>
